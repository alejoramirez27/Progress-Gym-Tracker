  <text x="330" y="552" text-anchor="middle" fill="#111318" font-size="24" font-family="system-ui" font-weight="700">80</text>
  <text x="330" y="568" text-anchor="middle" fill="#7a8290" font-size="10" font-family="system-ui">kg</text>

